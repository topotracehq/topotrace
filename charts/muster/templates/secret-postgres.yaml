{{- if and .Values.postgres.enabled (not .Values.postgres.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muster.fullname" . }}-postgres
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A single DSN, for the muster server's MUSTER_POSTGRES_DSN. Plus the
  # individual fields, for the postgres:16-alpine image's own
  # POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB init-time env vars -- both
  # read from the same Secret so there's exactly one place credentials
  # live. The defaults in values.yaml are placeholders for local testing
  # only; override postgres.credentials.* (or point existingSecret at
  # your own Secret) for anything that isn't a throwaway cluster.
  dsn: {{ include "muster.postgresDSN" . | quote }}
  POSTGRES_USER: {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.credentials.database | quote }}
{{- end }}
