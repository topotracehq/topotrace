{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "muster.fullname" . }}-postgres
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  # Headless -- the standard pattern for a StatefulSet's governing
  # Service, giving each pod a stable DNS identity
  # (<pod>.<service>.<namespace>.svc.cluster.local) even though this
  # chart only ever runs one replica today.
  clusterIP: None
  selector:
    {{- include "muster.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "muster.fullname" . }}-postgres
  labels:
    {{- include "muster.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "muster.fullname" . }}-postgres
  # Deliberately fixed at 1: Postgres doesn't gain anything from more
  # StatefulSet replicas without real streaming replication wired up,
  # which is out of scope here. The StatefulSet is used for what it
  # actually buys at replicas=1 -- a stable identity and a
  # per-pod PersistentVolumeClaim that survives pod rescheduling -- not
  # for horizontal scaling.
  replicas: 1
  selector:
    matchLabels:
      {{- include "muster.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "muster.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ include "muster.fullname" . }}-postgres
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "muster.postgresSecretName" . }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              # subPath avoids the well-known "postgres won't start,
              # data directory not empty (lost+found)" trap you hit
              # mounting straight at the volume root on some CSI drivers.
              subPath: pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.credentials.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.credentials.user | quote }}]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storageClassName }}
        storageClassName: {{ .Values.postgres.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
{{- end }}
