{{/*
Chart-managed auth-token Secret. Only rendered when a plaintext
auth.token was given and no existingSecret override -- the same
"generate a Secret from values, or let the user bring their own" pattern
secret-postgres.yaml uses for the Postgres DSN. Leaving auth.token unset
entirely means no Secret is created and the server runs exactly like
every earlier round of this chart: no -auth-token, demo mode.
*/}}
{{- if and .Values.auth.token (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "muster.fullname" . }}-auth
  labels:
    {{- include "muster.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.auth.token | quote }}
{{- end }}
