apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "topotrace.fullname" . }}-server
  labels:
    {{- include "topotrace.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # Left at server.replicaCount (default 1) rather than forced to 1: the
  # API/webui handlers are stateless and safe to scale out behind the
  # Service, but the ingest daemon's zip-slip-guarded raw-packet writes
  # go to whatever the pod's -data-dir is -- fine with Postgres as the
  # store backend (all pods share the same database), NOT fine with
  # memstore (each replica would have its own disjoint in-memory state).
  # Bump this only when postgres.enabled is true.
  replicas: {{ .Values.server.replicaCount }}
  selector:
    matchLabels:
      {{- include "topotrace.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "topotrace.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- if .Values.rbac.create }}
      serviceAccountName: {{ include "topotrace.fullname" . }}-server
      {{- end }}
      automountServiceAccountToken: false
      {{- if .Values.postgres.enabled }}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ include "topotrace.fullname" . }}-postgres -U {{ .Values.postgres.credentials.user }}; do
                echo "waiting for postgres..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: topotrace
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -api-addr=:{{ .Values.server.apiPort }}
            - -ingest-addr=:{{ .Values.server.ingestPort }}
            - -data-dir=/app/data
            {{- if .Values.webhooks.urls }}
            - -webhook-url={{ .Values.webhooks.urls }}
            {{- end }}
            - -evaluator-interval={{ .Values.evaluator.intervalSeconds }}s
          {{- if or .Values.postgres.enabled (eq (include "topotrace.authEnabled" .) "true") }}
          env:
            {{- if .Values.postgres.enabled }}
            - name: TOPOTRACE_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "topotrace.postgresSecretName" . }}
                  key: dsn
            {{- end }}
            {{- if eq (include "topotrace.authEnabled" .) "true" }}
            - name: TOPOTRACE_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "topotrace.authSecretName" . }}
                  key: token
            {{- end }}
          {{- end }}
          ports:
            - name: api
              containerPort: {{ .Values.server.apiPort }}
            - name: ingest
              containerPort: {{ .Values.server.ingestPort }}
          # internal/api already exposes GET /healthz for exactly this --
          # no separate probe endpoint needed.
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: data
          # With postgres.enabled, this volume only ever holds raw
          # ingested packets before they're cooked -- disposable by
          # design, emptyDir is correct. Without it (memstore mode) this
          # IS the data (JSON snapshot + raw packets), and emptyDir means
          # it's lost on pod restart -- the right tradeoff for a quick
          # demo, not for anything you want to persist. Set
          # postgres.enabled: true if that matters to you.
          emptyDir: {}
