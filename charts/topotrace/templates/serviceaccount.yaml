{{/*
One ServiceAccount per workload, every one with automountServiceAccountToken
set explicitly rather than left to the (also-false, but implicit) default.
Nothing in this chart calls the Kubernetes API today, so the correct,
least-privilege posture is "no token, period" for the server and Postgres
-- and for the agent, a token only when rbac.grantPodReadAccess actually
grants it something to do with one. See the chart README's RBAC section.
*/}}
{{- if .Values.rbac.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "topotrace.fullname" . }}-server
  labels:
    {{- include "topotrace.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "topotrace.fullname" . }}-postgres
  labels:
    {{- include "topotrace.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "topotrace.fullname" . }}-agent
  labels:
    {{- include "topotrace.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.rbac.grantPodReadAccess }}
{{- end }}
