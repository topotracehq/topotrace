<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muster</title>
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="img/favicon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="img/mark.png" alt="" class="brand-mark">
      <span class="brand-word">MUSTER</span>
      <span class="brand-tagline">Inventory &middot; Insight &middot; Control</span>
    </a>
    <nav class="view-tabs">
      <a href="#/" data-view="hosts" title="Hosts" aria-label="Hosts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.6" fill="currentColor" stroke="none"/><circle cx="7" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg><span class="tab-label">Hosts</span></a>
      <a href="#/board" data-view="board" title="Board" aria-label="Board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="5" height="16" rx="1.2"/><rect x="9.5" y="4" width="5" height="10" rx="1.2"/><rect x="16" y="4" width="5" height="13" rx="1.2"/></svg><span class="tab-label">Board</span></a>
      <a href="#/fleet" data-view="fleet" title="Fleet" aria-label="Fleet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.2"/><rect x="14" y="3" width="7" height="7" rx="1.2"/><rect x="3" y="14" width="7" height="7" rx="1.2"/><rect x="14" y="14" width="7" height="7" rx="1.2"/></svg><span class="tab-label">Fleet</span></a>
      <a href="#/agents" data-view="agents" title="Agents" aria-label="Agents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1.5"/><line x1="8" y1="20" x2="16" y2="20"/><line x1="12" y1="16" x2="12" y2="20"/></svg><span class="tab-label">Agents</span></a>
      <a href="#/compliance" data-view="compliance" title="Compliance" aria-label="Compliance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><polyline points="9 12 11 14 15 10"/></svg><span class="tab-label">Compliance</span></a>
      <a href="#/ask" data-view="ask" title="Ask Muster" aria-label="Ask Muster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-4 4V5z"/><line x1="8" y1="9" x2="16" y2="9"/><line x1="8" y1="12.5" x2="13" y2="12.5"/></svg><span class="tab-label">Ask Muster</span></a>
      <a href="#/docs" data-view="docs" title="Docs" aria-label="Docs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h9l5 5v11H5V4z"/><path d="M14 4v5h5"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg><span class="tab-label">Docs</span></a>
      <a href="#/settings" data-view="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><line x1="12" y1="2" x2="12" y2="5.5"/><line x1="12" y1="18.5" x2="12" y2="22"/><line x1="2" y1="12" x2="5.5" y2="12"/><line x1="18.5" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7.3" y2="7.3"/><line x1="16.7" y1="16.7" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7.3" y2="16.7"/><line x1="16.7" y1="7.3" x2="19.1" y2="4.9"/></svg><span class="tab-label">Settings</span></a>
    </nav>
    <div class="auth-control">
      <span id="oauth-status" class="oauth-status" hidden></span>
      <button type="button" id="auth-toggle" class="ghost">Auth</button>
      <form id="auth-form" class="auth-form" hidden>
        <input id="auth-token-input" type="password" placeholder="Bearer token (master or an API key)" autocomplete="off">
        <button type="submit">Save</button>
        <button type="button" id="auth-clear" class="ghost">Clear</button>
        <span id="auth-status" class="save-msg"></span>
      </form>
    </div>
    <form id="search-form" class="search">
      <select id="search-field" title="Field to search">
        <option value="distribution">Distribution</option>
        <option value="distribution_version">Distribution version</option>
        <option value="kernel_version">Kernel version</option>
        <option value="os">OS</option>
        <option value="cpu_model">CPU model</option>
      </select>
      <input id="search-contains" type="text" placeholder="contains&hellip; e.g. Ubuntu" autocomplete="off">
      <button type="submit">Search</button>
      <button type="button" id="search-clear" class="ghost" hidden>Clear</button>
    </form>
  </header>

  <main id="app"></main>

  <footer class="footer">
    Muster &mdash; a hardware/software/configuration inventory system.
    <a href="/healthz">healthz</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
