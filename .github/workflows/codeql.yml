name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, Monday 09:00 UTC — catches newly-disclosed CVEs even with no code changes
    - cron: "0 9 * * 1"

permissions:
  contents: read
  security-events: write
  # Needed by CodeQL's diff-informed analysis, which calls the Actions API
  # to fetch workflow-run metadata (GET /repos/{owner}/{repo}/actions/runs/{id}).
  # Without it, analysis fails with "Resource not accessible by integration".
  actions: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        # Same Advanced-Security-requires-public-repo constraint as gosec's
        # SARIF upload (see ci.yml): the scan itself runs fine, but
        # uploading results 403s while this repo is private. Remove once
        # the repo goes public.
        continue-on-error: true
        with:
          category: "/language:go"
