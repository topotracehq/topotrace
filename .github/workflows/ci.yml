name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # Needed by gosec's github/codeql-action/upload-sarif step, which calls
  # the Actions API for workflow-run metadata (same issue CodeQL itself hits).
  actions: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet $(go list ./... | grep -v /vendor/)

      - name: go build
        run: go build ./...

      - name: go test
        run: go test $(go list ./... | grep -v /vendor/) -race -covermode=atomic

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  gosec:
    name: Static security analysis (gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gosec
        uses: securego/gosec@master
        # Report-only for now: gosec found 88 findings on the first real run
        # (mostly G104 unhandled-error style, plus some worth real triage -
        # G304/G70x taint findings, G101, G110, G112, G202). Tracked as a
        # backlog item rather than blocking merges; flip this off once the
        # backlog is worked down and you want gosec to gate PRs again.
        continue-on-error: true
        with:
          args: "-fmt sarif -out gosec-results.sarif -exclude-generated -exclude-dir=vendor ./..."
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-extract
          tar -C /tmp/gitleaks-extract -xzf /tmp/gitleaks.tar.gz gitleaks
      - name: Run gitleaks
        run: /tmp/gitleaks-extract/gitleaks detect --source . --redact -v
